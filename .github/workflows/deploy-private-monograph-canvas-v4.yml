name: Deploy Private Monograph Canvas v4

on:
  pull_request:
    branches: [main]
    paths:
      - cloud/private-monograph-canvas-v4/**
      - .github/workflows/deploy-private-monograph-canvas-v4.yml
  push:
    branches: [main]
    paths:
      - cloud/private-monograph-canvas-v4/**
      - .github/workflows/deploy-private-monograph-canvas-v4.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanzer-private-monograph-canvas-v4-production
  cancel-in-progress: false

env:
  CLOUDFLARE_PAGES_PROJECT: tanzer-private-monograph-canvas-v4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-ebgaramond fonts-inter fonts-urw-base35 file
          python3 -m pip install --quiet pillow numpy

      - name: Validate renderer, sender, and configuration source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            cloud/private-monograph-canvas-v4/render_canvas.py \
            cloud/private-monograph-canvas-v4/render_batch.py
          python3 -m json.tool cloud/private-monograph-canvas-v4/messages.json >/dev/null
          python3 -m json.tool cloud/private-monograph-canvas-v4/appsscript.json >/dev/null
          cp cloud/private-monograph-canvas-v4/Code.gs /tmp/CanvasV4.js
          cat cloud/private-monograph-canvas-v4/TanzerBootstrap.gs >> /tmp/CanvasV4.js
          node --check /tmp/CanvasV4.js
          test "$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('cloud/private-monograph-canvas-v4/messages.json').read_text())
          print(len(data['records']))
          PY
          )" = "20"
          if grep -Eq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' cloud/private-monograph-canvas-v4/messages.json; then
            echo 'Public render source unexpectedly contains recipient email addresses.' >&2
            exit 1
          fi
          grep -q 'GmailApp.getAliases' cloud/private-monograph-canvas-v4/Code.gs
          grep -q 'inlineImages: { canvas: blob }' cloud/private-monograph-canvas-v4/Code.gs
          grep -q "from: alias" cloud/private-monograph-canvas-v4/Code.gs
          grep -q 'automaticExternalSend: false' cloud/private-monograph-canvas-v4/Code.gs
          grep -q '1Uxr48BV65b9TfLedl6OFtxKukavbGF-0OMAGISbahzM' cloud/private-monograph-canvas-v4/TanzerBootstrap.gs

      - name: Render exact correspondence canvases
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/prospects
          python3 cloud/private-monograph-canvas-v4/render_canvas.py \
            --output dist/private-monograph-canvas-v4.jpg
          python3 cloud/private-monograph-canvas-v4/render_batch.py \
            --messages cloud/private-monograph-canvas-v4/messages.json \
            --output-dir dist/prospects
          cp cloud/private-monograph-canvas-v4/index.html dist/index.html
          cp cloud/private-monograph-canvas-v4/_headers dist/_headers

      - name: Consolidated canvas QA
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/private-monograph-canvas-v4.jpg
          test "$(stat -c%s dist/private-monograph-canvas-v4.jpg)" -gt 300000
          file dist/private-monograph-canvas-v4.jpg | grep -q 'JPEG image data'

          prospect_count=$(find dist/prospects -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')
          test "$prospect_count" = "20"
          for image in dist/prospects/*.jpg; do
            test "$(stat -c%s "$image")" -gt 250000
            file "$image" | grep -q 'JPEG image data'
          done
          for required in \
            dist/prospects/averity.jpg \
            dist/prospects/talentfoot.jpg \
            dist/prospects/kaye-bassman-international.jpg; do
            test -s "$required"
          done

          grep -q 'TA_PRIVATE_MONOGRAPH_CANVAS_V4' dist/index.html
          grep -q 'director@tanzeranderson.com' dist/index.html
          grep -q 'Managing Director - Strategy and Business Development' dist/index.html
          grep -q 'private-monograph-canvas-v4.jpg' dist/index.html
          grep -q '/prospects/\*' dist/_headers
          grep -q 'noindex' dist/_headers
          echo 'Private Monograph Canvas v4 QA: PASS — 1 master + 20 personalized canvases'

      - name: Ensure Cloudflare Pages project
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          status=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$endpoint")
          if [ "$status" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"${CLOUDFLARE_PAGES_PROJECT}\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              > /tmp/project-created.json
          elif [ "$status" != "200" ]; then
            cat /tmp/project.json >&2
            exit 1
          fi

      - name: Deploy exact-render canvases
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-dirty=true

      - name: Verify deployed canvases
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          origin="https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          curl -fsSL "$origin/" | grep -q 'TA_PRIVATE_MONOGRAPH_CANVAS_V4'
          for route in \
            /private-monograph-canvas-v4.jpg \
            /prospects/averity.jpg \
            /prospects/talentfoot.jpg \
            /prospects/kaye-bassman-international.jpg; do
            headers=$(curl -fsSI "$origin$route" | tr -d '\r')
            grep -qi '^content-type: image/jpeg' <<< "$headers"
            grep -qi '^cache-control:.*immutable' <<< "$headers"
          done
          {
            echo '## Private Monograph Canvas v4'
            echo "Preview: ${origin}/"
            echo "Master canvas: ${origin}/private-monograph-canvas-v4.jpg"
            echo "Personalized canvases: ${origin}/prospects/{slug}.jpg"
            echo 'Deployment verification: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
