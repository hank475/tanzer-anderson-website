name: NQ Intelligence Firm - Weekday 6 AM Estimate

on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1-5'
      timezone: 'America/Chicago'
    - cron: '17 6 * * 1-5'
      timezone: 'America/Chicago'

permissions:
  actions: write
  contents: read

# Preserve the established daily triggers while using the current publisher.
# The obsolete archive renderer must not overwrite the approved v2.2 route.
jobs:
  dispatch-current-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the existing current NQ publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-nq-intelligence-live.yml --repo "${{ github.repository }}" --ref main
