name: Deploy White Arc Sprint Private Room

on:
  push:
    branches: [main]
    paths:
      - cloud/sprint-private-room/**
      - .github/workflows/deploy-sprint-private-room.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: tanzer-anderson-sprint-private-room-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp cloud/sprint-private-room/index.html site/index.html
          touch site/.nojekyll

      - name: Consolidated room QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('site/index.html')
          if not page.exists() or page.stat().st_size < 25000:
              raise SystemExit('Sprint room HTML is missing or unexpectedly small')

          text = page.read_text(encoding='utf-8')
          required = [
              'White Arc Sprint Private Room',
              'Live cloud room · v1.2 · synthetic candidate data',
              'data-deployment="cloud-live-v1.2"',
              'Candidate Recommendations',
              'Why this person was chosen',
              'How to approach',
              'LinkedIn profile ID',
              'demo-isabella-morgan',
              'demo-noah-bennett',
              'tanzer-anderson-approved-slate.csv',
              '<meta name="robots" content="noindex,nofollow,noarchive">',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Missing required room content: {missing}')
          if 'https://www.linkedin.com/' in text:
              raise SystemExit('Synthetic staging room must not contain live LinkedIn URLs')
          if re.search(r'\bfetch\s*\(', text):
              raise SystemExit('Static staging room unexpectedly contains an API call')
          if text.count("li:'demo-") != 10:
              raise SystemExit('Expected ten synthetic LinkedIn profile IDs')
          print('White Arc Sprint Private Room QA: PASS')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live URL
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -n --arg body "White Arc Sprint Private Room deployment verified: ${PAGE_URL}" '{body:$body}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/4/comments" \
            -d "$body"
          {
            echo '## White Arc Sprint Private Room'
            echo "Live URL: ${PAGE_URL}"
            echo 'Deployment verification: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
