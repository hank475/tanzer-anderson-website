name: Deploy White Arc Sprint Private Room

on:
  push:
    branches: [main]
    paths:
      - cloud/sprint-private-room/**
      - .github/workflows/deploy-sprint-private-room.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tanzer-anderson-sprint-private-room-pages
  cancel-in-progress: true

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp cloud/sprint-private-room/index.html site/index.html
          touch site/.nojekyll

      - name: Consolidated room QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('site/index.html')
          if not page.exists() or page.stat().st_size < 25000:
              raise SystemExit('Sprint room HTML is missing or unexpectedly small')

          text = page.read_text(encoding='utf-8')
          required = [
              'White Arc Sprint Private Room',
              'Live cloud room · v1.2 · synthetic candidate data',
              'data-deployment="cloud-live-v1.2"',
              'Candidate Recommendations',
              'Why this person was chosen',
              'How to approach',
              'LinkedIn profile ID',
              'demo-isabella-morgan',
              'demo-noah-bennett',
              'tanzer-anderson-approved-slate.csv',
              '<meta name="robots" content="noindex,nofollow,noarchive">',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Missing required room content: {missing}')
          if 'https://www.linkedin.com/' in text:
              raise SystemExit('Synthetic staging room must not contain live LinkedIn URLs')
          if re.search(r'\bfetch\s*\(', text):
              raise SystemExit('Static staging room unexpectedly contains an API call')
          if text.count("li:'demo-") != 10:
              raise SystemExit('Expected ten synthetic LinkedIn profile IDs')
          print('White Arc Sprint Private Room QA: PASS')
          PY

      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: Publish White Arc Sprint Private Room ${{ github.sha }}

      - name: Verify live browser endpoint
        id: verify
        env:
          ROOM_URL: https://hank475.github.io/tanzer-anderson-website/
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/live-room.html -w '%{http_code}' "$ROOM_URL" || true)
            if [ "$code" = "200" ] && grep -q 'Live cloud room · v1.2 · synthetic candidate data' /tmp/live-room.html; then
              echo "url=$ROOM_URL" >> "$GITHUB_OUTPUT"
              echo "Live endpoint verified on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: endpoint returned ${code:-network-error}; retrying"
            sleep 10
          done
          echo 'GitHub Pages did not expose the approved room within the verification window.' >&2
          exit 1

      - name: Write deployment summary
        env:
          PAGE_URL: ${{ steps.verify.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## White Arc Sprint Private Room'
            echo "Live URL: ${PAGE_URL}"
            echo 'Deployment verification: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
