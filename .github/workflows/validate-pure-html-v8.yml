name: Validate Max Safe V9

on:
  pull_request:
    branches: [main]
    paths:
      - cloud/email/pure-html-v8/**
      - .github/workflows/validate-pure-html-v8.yml
  push:
    branches: [main]
    paths:
      - cloud/email/pure-html-v8/**
      - .github/workflows/validate-pure-html-v8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate syntax and generate canonical Max Safe V9
        shell: bash
        run: |
          set -euo pipefail
          cp cloud/email/pure-html-v8/Code.gs /tmp/max-safe-v9.js
          node --check /tmp/max-safe-v9.js
          node cloud/email/pure-html-v8/validate-v8.js

      - name: Confirm MIME-safe HTML contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool cloud/email/pure-html-v8/policy.json >/dev/null
          file=cloud/email/pure-html-v8/artifacts/max-safe-v9.html
          test -s "$file"
          test "$(stat -c%s "$file")" -lt 50000
          ! grep -Eqi '<img|background-image|url\(|cid:|data:image|<style|@media|<script|display:flex|display:grid|position:absolute|position:fixed|transform:' "$file"
          ! grep -Eqi '\bring\b' "$file"
          grep -q 'Dear Henry,' "$file"
          grep -q 'PROOF OF CONCEPT' "$file"
          grep -q 'director@tanzeranderson.com' "$file"
          grep -q '"qa_pass": true' cloud/email/pure-html-v8/artifacts/receipt.json
          echo 'Max Safe V9 QA: PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: max-safe-v9-sample
          path: cloud/email/pure-html-v8/artifacts
          if-no-files-found: error
