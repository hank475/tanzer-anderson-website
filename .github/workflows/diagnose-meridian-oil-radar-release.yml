name: Diagnose Meridian Oil Radar Release

on:
  push:
    branches: [main]
    paths:
      - cloud/meridian-oil-radar-push-signal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Diagnose release package and record exact result
        shell: bash
        run: |
          set -u
          result=pass
          stage=credentials
          detail='All release-package checks passed.'
          expected='not-read'
          actual='not-computed'
          part_count=0
          archive_bytes=0
          APP_DIR="$RUNNER_TEMP/meridian-oil-radar-diagnostic"
          ARCHIVE="$RUNNER_TEMP/meridian-oil-radar-diagnostic.tgz"

          fail() {
            if [ "$result" = pass ]; then
              result=fail
              detail="$1"
            fi
          }

          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || fail 'CLOUDFLARE_API_TOKEN is unavailable.'
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || fail 'CLOUDFLARE_ACCOUNT_ID is unavailable.'

          if [ "$result" = pass ]; then
            stage=part-discovery
            part_count=$(find cloud/meridian-oil-radar-payload -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')
            [ "$part_count" -eq 8 ] || fail "Expected 8 payload parts; found ${part_count}."
          fi

          if [ "$result" = pass ]; then
            stage=base64-decode
            if ! cat cloud/meridian-oil-radar-payload/part-* | tr -d '\r\n' | base64 --decode > "$ARCHIVE"; then
              fail 'Base64 decoding failed.'
            fi
            archive_bytes=$(wc -c < "$ARCHIVE" | tr -d ' ')
            [ "$archive_bytes" -gt 0 ] || fail 'Decoded archive is empty.'
          fi

          if [ "$result" = pass ]; then
            stage=checksum
            expected=$(awk 'NR==1 {print $1}' cloud/meridian-oil-radar-release.sha256)
            actual=$(sha256sum "$ARCHIVE" | awk '{print $1}')
            [ "$expected" = "$actual" ] || fail "Checksum mismatch: expected ${expected}; actual ${actual}."
          fi

          if [ "$result" = pass ]; then
            stage=archive-index
            tar -tzf "$ARCHIVE" > "$RUNNER_TEMP/archive-index.txt" 2> "$RUNNER_TEMP/archive-error.txt" || fail "Archive index failed: $(tr '\n' ' ' < "$RUNNER_TEMP/archive-error.txt")"
          fi

          if [ "$result" = pass ]; then
            stage=archive-extraction
            rm -rf "$APP_DIR"
            mkdir -p "$APP_DIR"
            tar -xzf "$ARCHIVE" -C "$APP_DIR" 2> "$RUNNER_TEMP/extract-error.txt" || fail "Archive extraction failed: $(tr '\n' ' ' < "$RUNNER_TEMP/extract-error.txt")"
          fi

          if [ "$result" = pass ]; then
            stage=required-files
            for path in public/index.html public/static/app.js public/static/styles.css 'functions/api/[[path]].js' public/_routes.json wrangler.jsonc; do
              [ -s "$APP_DIR/$path" ] || fail "Required file missing or empty: ${path}."
            done
          fi

          if [ "$result" = pass ]; then
            stage=javascript-syntax
            node --check "$APP_DIR/public/static/app.js" > "$RUNNER_TEMP/app-check.txt" 2>&1 || fail "Frontend JavaScript check failed: $(tr '\n' ' ' < "$RUNNER_TEMP/app-check.txt")"
            node --check "$APP_DIR/functions/api/[[path]].js" > "$RUNNER_TEMP/function-check.txt" 2>&1 || fail "Function JavaScript check failed: $(tr '\n' ' ' < "$RUNNER_TEMP/function-check.txt")"
          fi

          checked=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p deployment-status
          cat > deployment-status/meridian-oil-radar-release-diagnostic.md <<EOF
          # Meridian Oil Radar — Release Diagnostic

          - Checked at: ${checked}
          - Event: ${GITHUB_EVENT_NAME}
          - Result: ${result}
          - Last stage: ${stage}
          - Detail: ${detail}
          - Payload parts: ${part_count}
          - Decoded archive bytes: ${archive_bytes}
          - Expected SHA-256: ${expected}
          - Actual SHA-256: ${actual}
          - Cloudflare API token available: $([ -n "${CLOUDFLARE_API_TOKEN:-}" ] && echo yes || echo no)
          - Cloudflare account ID available: $([ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && echo yes || echo no)
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-status/meridian-oil-radar-release-diagnostic.md
          git commit -m "chore: record Meridian Oil Radar release diagnostic ${result}"
          pushed=false
          for attempt in $(seq 1 5); do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git pull --rebase origin main
            sleep 2
          done
          [ "$pushed" = true ] || exit 1

          if [ "$result" != pass ]; then
            echo "$detail" >&2
            exit 1
          fi
