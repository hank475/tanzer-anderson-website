name: Build email background assets

on:
  push:
    branches: [main]
    paths:
      - 'email-standard/assets/*.b64part*'
      - '.github/workflows/build-email-background-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode email background assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          first_parts=(email-standard/assets/*.b64part00)
          if [ ${#first_parts[@]} -eq 0 ]; then
            echo "No encoded asset parts found."
            exit 0
          fi
          for first in "${first_parts[@]}"; do
            target="${first%.b64part00}"
            cat "${target}".b64part* | base64 --decode > "$target"
            echo "Built $target"
          done

      - name: Commit generated binary assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- email-standard/assets; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-standard/assets
          git commit -m "Build email background binary assets"
          git push
