name: Build email background assets

on:
  push:
    branches: [main]
    paths:
      - 'email-standard/assets/tanzer-background-01.jpg.b64'
      - '.github/workflows/build-email-background-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode Gmail background asset
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode \
            email-standard/assets/tanzer-background-01.jpg.b64 \
            > email-standard/assets/tanzer-background-01.jpg
          file email-standard/assets/tanzer-background-01.jpg

      - name: Commit generated binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-standard/assets/tanzer-background-01.jpg
          if git diff --cached --quiet; then
            echo "Generated asset is already current."
            exit 0
          fi
          git commit -m "Build Gmail background binary asset"
          git push
