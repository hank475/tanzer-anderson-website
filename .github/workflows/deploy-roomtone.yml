name: Deploy RoomTone Acoustic Thermometer

on:
  push:
    branches: [main]
    paths:
      - cloud/roomtone-v2-payload/**
      - cloud/roomtone-v2-release.sha256
      - .github/workflows/deploy-roomtone.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roomtone-production
  cancel-in-progress: false

env:
  SITE_URL: https://hank475.github.io/tanzer-anderson-website/roomtone

jobs:
  qa-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize verified RoomTone release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/roomtone-v2-release.tar.gz"
          cat cloud/roomtone-v2-payload/part-* | tr -d '\r\n' | base64 --decode > "$archive"
          test -s "$archive"
          expected=$(awk '{print $1}' cloud/roomtone-v2-release.sha256)
          echo "$expected  $archive" | sha256sum --check
          rm -rf cloud/roomtone-v2
          mkdir -p cloud/roomtone-v2
          tar -xzf "$archive" -C cloud/roomtone-v2
          for file in index.html app.js physics.mjs signal.mjs styles.css manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png; do
            test -s "cloud/roomtone-v2/public/$file"
          done
          test -s cloud/roomtone-v2/tests/test.mjs

      - name: Consolidated application QA
        shell: bash
        run: |
          set -euo pipefail
          root=cloud/roomtone-v2
          node --check "$root/public/app.js"
          node --check "$root/public/physics.mjs"
          node --check "$root/public/signal.mjs"
          cp "$root/public/physics.mjs" "$root/tests/physics.mjs"
          cp "$root/public/signal.mjs" "$root/tests/signal.mjs"
          node "$root/tests/test.mjs"
          python3 -m json.tool "$root/public/manifest.webmanifest" >/dev/null
          python3 - <<'PYQA'
          from pathlib import Path
          import json, re

          root = Path('cloud/roomtone-v2/public')
          files = {name: (root / name).read_text(encoding='utf-8') for name in [
              'index.html', 'app.js', 'physics.mjs', 'signal.mjs', 'sw.js'
          ]}
          page, app = files['index.html'], files['app.js']
          required = {
              'index.html': [
                  'RoomTone', 'Measure this room', 'Mark two stable phone positions',
                  'Fast · 3 passes', 'Best · 7 passes',
                  'Calibrate this phone and wall setup',
                  'What RoomTone cannot promise',
                  'Simulated example — not a reading',
                  'mobile-web-app-capable'
              ],
              'app.js': [
                  'navigator.mediaDevices.getUserMedia', 'createScriptProcessor',
                  'analyzeEchoCapture', 'speedFromEchoDifferentialMps',
                  'temperatureFromEchoDifferentialC', 'localStorage',
                  'wall_echo_missing', 'echo_inconsistent', 'permission_denied',
                  'No microphone was used, no history item was created'
              ],
              'signal.mjs': [
                  'buildEchoPulseTrainSamples', 'analyzeEchoCapture',
                  'wall_echo_missing', 'echo_inconsistent'
              ],
              'physics.mjs': [
                  'speedFromEchoDifferentialMps',
                  'temperatureFromEchoDifferentialC',
                  'estimateEchoTemperatureUncertaintyC'
              ],
              'sw.js': ['roomtone-shell-v2.0.0', 'caches.open', 'self.clients.claim'],
          }
          missing = [f'{name}: {token}' for name, tokens in required.items() for token in tokens if token not in files[name]]
          if missing:
              raise SystemExit(f'Missing required RoomTone capabilities: {missing}')

          ids = re.findall(r'\bid="([^"]+)"', page)
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate HTML IDs detected.')
          referenced = set(re.findall(r"getElementById\(['\"]([^'\"]+)", app))
          absent = sorted(referenced - set(ids))
          if absent:
              raise SystemExit(f'JavaScript references missing HTML IDs: {absent}')

          combined = '\n'.join(files.values()).lower()
          prohibited = [
              'api.openai.com', 'google-analytics.com', 'googletagmanager.com',
              'localhost:', 'hard-coded room temperature', 'fake room reading',
              'todo', 'fixme', 'coming soon', 'lorem ipsum'
          ]
          found = [token for token in prohibited if token in combined]
          if found:
              raise SystemExit(f'Prohibited production marker found: {found}')

          manifest = json.loads((root / 'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('display') != 'standalone' or manifest.get('start_url') != './' or len(manifest.get('icons', [])) < 2:
              raise SystemExit('PWA manifest is incomplete.')
          if 'https://' in page or 'http://' in page:
              raise SystemExit('The runtime shell contains an external dependency.')
          print('RoomTone source, numerical, privacy, and PWA QA: PASS')
          PYQA

      - name: Publish isolated RoomTone directory to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/roomtone-gh-pages"
          rm -rf "$pages"
          git fetch origin gh-pages
          git worktree add -B gh-pages "$pages" origin/gh-pages

          rm -rf "$pages/roomtone"
          mkdir -p "$pages/roomtone"
          cp -a cloud/roomtone-v2/public/. "$pages/roomtone/"
          rm -f "$pages/roomtone/_headers"
          touch "$pages/.nojekyll"

          git -C "$pages" config user.name 'github-actions[bot]'
          git -C "$pages" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$pages" add roomtone .nojekyll
          if git -C "$pages" diff --cached --quiet; then
            echo 'RoomTone publication is already current.'
            exit 0
          fi

          git -C "$pages" commit -m "publish: RoomTone iPhone-compatible wall-echo PWA ${GITHUB_SHA}"
          for attempt in $(seq 1 6); do
            if git -C "$pages" push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Concurrent gh-pages update detected; rebasing attempt $attempt/6."
            git -C "$pages" pull --rebase origin gh-pages
            sleep 3
          done
          echo 'Unable to publish RoomTone after six protected retries.' >&2
          exit 1

      - name: Verify live HTTPS mobile application
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_SHA}-${attempt}"
            page_code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/home.html" -w '%{http_code}' "$SITE_URL/?v=$stamp" || true)
            app_code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/app.js" -w '%{http_code}' "$SITE_URL/app.js?v=$stamp" || true)
            manifest_code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/manifest.json" -w '%{http_code}' "$SITE_URL/manifest.webmanifest?v=$stamp" || true)
            signal_code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/signal.mjs" -w '%{http_code}' "$SITE_URL/signal.mjs?v=$stamp" || true)
            sw_code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/sw.js" -w '%{http_code}' "$SITE_URL/sw.js?v=$stamp" || true)
            if [ "$page_code" = 200 ] && [ "$app_code" = 200 ] && [ "$manifest_code" = 200 ] \
              && [ "$signal_code" = 200 ] && [ "$sw_code" = 200 ] \
              && grep -q 'Measure this room' "$RUNNER_TEMP/home.html" \
              && grep -q 'navigator.mediaDevices.getUserMedia' "$RUNNER_TEMP/app.js" \
              && grep -q 'analyzeEchoCapture' "$RUNNER_TEMP/signal.mjs" \
              && grep -q 'roomtone-shell-v2.0.0' "$RUNNER_TEMP/sw.js" \
              && jq -e '.display == "standalone" and (.icons | length >= 2)' "$RUNNER_TEMP/manifest.json" >/dev/null 2>&1; then
              verified=true
              break
            fi
            echo "Pages propagation $attempt/30: home=$page_code app=$app_code manifest=$manifest_code signal=$signal_code sw=$sw_code"
            sleep 10
          done
          test "$verified" = true
          for asset in styles.css physics.mjs icon.svg icon-192.png icon-512.png; do
            curl -fsS --retry 2 --retry-all-errors --max-time 30 "$SITE_URL/$asset?v=$GITHUB_SHA" >/dev/null
          done
          echo "RoomTone production verification: PASS — $SITE_URL/"

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo '## RoomTone is live'
            echo
            echo "- Production URL: $SITE_URL/"
            echo '- Delivery: mobile-first HTTPS PWA'
            echo '- Installation: optional; no ZIP, app-store download, account, or paid API'
            echo '- Measurement: two-position, mono-compatible wall-echo time of flight'
            echo '- Real microphone capture and local signal processing: enabled'
            echo '- Synthetic readings: explicitly isolated and labeled'
            echo '- Local-only history and calibration: enabled'
            echo '- Numerical, synthetic-signal, privacy, PWA, and live production tests: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
