name: Deploy Commercial Talent Sprint

on:
  pull_request:
    branches: [main]
    paths:
      - cloud/commercial-talent-sprint/**
      - .github/workflows/deploy-commercial-talent-sprint.yml
  push:
    branches: [main]
    paths:
      - cloud/commercial-talent-sprint/**
      - .github/workflows/deploy-commercial-talent-sprint.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanzer-anderson-commercial-talent-sprint-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Capture current production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          wget --recursive --level=inf --page-requisites --adjust-extension --convert-links \
            --no-host-directories --domains=tanzeranderson.com,www.tanzeranderson.com \
            --directory-prefix=site --user-agent='Tanzer-Anderson-Sprint-Release/1.0' \
            https://tanzeranderson.com/ || test $? -eq 8
          for path in \
            about/ about/principles/ contact/ private-client/ \
            private-client/search-command/ private-client/candidate-intelligence/ private-client/decisions-outcomes/ \
            what-we-do/ what-we-do/executive-search/ what-we-do/professional-staffing/ \
            what-we-do/talent-advisory/ what-we-do/market-intelligence/ approach/ \
            who-we-advise/ceos-boards-executive-teams/ who-we-advise/private-equity-portfolio-companies/ \
            who-we-advise/technology-ai-cybersecurity/ who-we-advise/engineering-industrial-infrastructure/ \
            who-we-advise/healthcare-financial-consumer/ insights/ privacy/ terms/ accessibility/; do
            mkdir -p "site/$path"
            curl -fsSL "https://tanzeranderson.com/$path" -o "site/${path}index.html"
          done
          curl -fsSL https://tanzeranderson.com/robots.txt -o site/robots.txt
          curl -fsSL https://tanzeranderson.com/sitemap.xml -o site/sitemap.xml

      - name: Install Sprint page and exact executive title
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/commercial-talent-sprint
          cp cloud/commercial-talent-sprint/index.html site/commercial-talent-sprint/index.html
          python3 - <<'PY'
          from pathlib import Path

          root = Path('site')
          exact = 'Managing Director - Strategy and Business Development'
          variants = [
              'Managing Director — Strategy &amp; Business Development',
              'Managing Director — Strategy & Business Development',
              'Managing Director – Strategy &amp; Business Development',
              'Managing Director – Strategy & Business Development',
              'Managing Director - Strategy &amp; Business Development',
              'Managing Director of Business Development &amp; Account Management',
              'Managing Director of Business Development & Account Management',
              'Managing Director, Strategy &amp; Business Development',
              'Managing Director, Strategy & Business Development',
          ]
          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8', errors='replace')
              original = text
              for old in variants:
                  text = text.replace(old, exact)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          sitemap = root / 'sitemap.xml'
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8', errors='replace')
              url = 'https://tanzeranderson.com/commercial-talent-sprint/'
              if url not in text and '</urlset>' in text:
                  entry = f'  <url><loc>{url}</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>\n'
                  text = text.replace('</urlset>', entry + '</urlset>')
                  sitemap.write_text(text, encoding='utf-8')
          PY

      - name: Consolidated launch QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('site')
          page = root / 'commercial-talent-sprint/index.html'
          required_files = [root/'index.html', root/'contact/index.html', root/'privacy/index.html', root/'terms/index.html', page]
          missing = [str(p) for p in required_files if not p.exists() or p.stat().st_size == 0]
          if missing:
              raise SystemExit(f'Missing required production outputs: {missing}')
          text = page.read_text(encoding='utf-8')
          required_tokens = [
              'COMMERCIAL_TALENT_SPRINT_V1',
              'https://buy.stripe.com/3cI9AVeob9nx9TuapJ3sI0b',
              'Commercial Talent Sprint',
              '25–40 evidence-backed prospects',
              'Ranked top-10 recommendation slate',
              'id="sprint-intake"',
              "fetch('/api/contact'",
              'clientservices@tanzeranderson.com',
              'Managing Director - Strategy and Business Development',
          ]
          missing_tokens = [token for token in required_tokens if token not in text]
          if missing_tokens:
              raise SystemExit(f'Missing Sprint page content: {missing_tokens}')
          prohibited = [
              '[PRIVATE SPRINT PAGE]',
              'Managing Director of Business Development & Account Management',
              'Managing Director — Strategy &amp; Business Development',
          ]
          present = [token for token in prohibited if token in text]
          if present:
              raise SystemExit(f'Prohibited placeholder or title remains: {present}')
          if text.count('https://buy.stripe.com/3cI9AVeob9nx9TuapJ3sI0b') < 4:
              raise SystemExit('Stripe checkout is not wired into every required purchase position')
          print('Commercial Talent Sprint launch QA: PASS')
          PY

      - name: Deploy to Cloudflare Pages production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest pages deploy site --project-name=tanzer-anderson-site2 --branch=main --commit-dirty=true

      - name: Production verification
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          for route in / /contact/ /commercial-talent-sprint/; do
            code=$(curl -sS -o /tmp/page -w '%{http_code}' "https://tanzeranderson.com$route")
            test "$code" = "200"
          done
          curl -fsSL https://tanzeranderson.com/commercial-talent-sprint/ | grep -q 'COMMERCIAL_TALENT_SPRINT_V1'
          curl -fsSL https://tanzeranderson.com/commercial-talent-sprint/ | grep -q '3cI9AVeob9nx9TuapJ3sI0b'
          curl -fsSL https://tanzeranderson.com/commercial-talent-sprint/ | grep -q 'Managing Director - Strategy and Business Development'
          echo 'Commercial Talent Sprint production verification: PASS'
