name: Daily Briefing Continuity Fallback

on:
  schedule:
    # GitHub cron is UTC. Run both possible Central offsets; the local-time
    # guard permits only the invocation that is exactly 07:15 Chicago time.
    - cron: '15 12 * * *'
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-briefing-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-henry-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce 7:15 AM America/Chicago window
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo('America/Chicago'))
          manual = os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          allowed = manual or (now.hour == 7 and now.minute == 15)
          print(f"allowed={'true' if allowed else 'false'}")
          print(f"date_key={now:%Y-%m-%d}")
          print(f"long_date={now:%A, %B %-d, %Y}")
          print(f"local_time={now:%Y-%m-%d %H:%M:%S %Z}")
          PY

      - name: Create or refresh Henry's continuity briefing
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_KEY: ${{ steps.gate.outputs.date_key }}
          LONG_DATE: ${{ steps.gate.outputs.long_date }}
          LOCAL_TIME: ${{ steps.gate.outputs.local_time }}
          CONTROL_SHEET: https://docs.google.com/spreadsheets/d/1nB6JIRhCCpoN3NyrQrhik2yiozWjFnfU1OqbjimtQX4/edit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('cloud/daily-briefing/fallback/briefings.json').read_text(encoding='utf-8'))['henry']
          title = f"[Daily Briefing] {os.environ['DATE_KEY']} — Henry"
          lines = [
              f"# {data['title']}",
              f"**{os.environ['LONG_DATE'].upper()}**  ",
              f"Generated by the independent GitHub continuity lane at {os.environ['LOCAL_TIME']}.  ",
              "@hank475",
              "",
              "> This issue is the no-secret continuity fallback. The full Version 2 textured HTML email and button service will take over after the Cloudflare and Email Service activation gates pass.",
              "",
              "## Executive Position",
              data['summary'],
              "",
              "## Top Priorities",
          ]
          lines += [f"- {item}" for item in data['topPriorities']]
          lines += ["", "## Decisions and Action Items"]
          for item in data['decisions'] + data['nextActions']:
              lines.append(f"- [ ] **{item['id']}** — {item['text']}")
          lines += [
              "",
              "### Approval Commands",
              "Comment **`APPROVE ALL`** to approve every unchecked item.",
              "Comment **`APPROVE A1,A3`** to approve only selected item IDs.",
              "Comment **`HOLD A2`** to explicitly hold an item.",
              "",
              "Approvals are recorded in this issue only; this fallback does not release external outreach or execute high-consequence actions.",
              "",
              "## Risks",
          ]
          lines += [f"- {item}" for item in data['risks']]
          lines += [
              "",
              "## Control Links",
              f"- [Daily Briefing Control Sheet]({os.environ['CONTROL_SHEET']})",
              "- [Independent deployment ledger](https://github.com/hank475/tanzer-anderson-website/issues/6)",
              "- [Briefing source and implementation](https://github.com/hank475/tanzer-anderson-website/tree/main/cloud/daily-briefing)",
              "",
              "---",
              "**TANZER ANDERSON** · Insight. Strategy. Impact.",
          ]
          Path('/tmp/briefing-title.txt').write_text(title, encoding='utf-8')
          Path('/tmp/briefing-body.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

          title=$(cat /tmp/briefing-title.txt)
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number,title --limit 20 --jq '.[] | select(.title == $title) | .number' --arg title "$title" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/briefing-body.md
            gh issue reopen "$existing" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            issue_number="$existing"
          else
            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/briefing-body.md --assignee hank475)
            issue_number=${issue_url##*/}
          fi
          echo "Briefing issue: https://github.com/${GITHUB_REPOSITORY}/issues/${issue_number}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record skipped duplicate UTC trigger
        if: steps.gate.outputs.allowed != 'true'
        shell: bash
        run: |
          echo "Skipped: this UTC trigger was not 07:15 America/Chicago." >> "$GITHUB_STEP_SUMMARY"
